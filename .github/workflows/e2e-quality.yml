name: E2E Scoring Quality Tests

on:
  schedule:
    - cron: '0 6 * * *'   # Nightly at 6 AM UTC
  workflow_dispatch:        # Manual trigger

jobs:
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run E2E Quality Tests
        working-directory: fluenthire-api
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          ./mvnw test -Pe2e-quality \
            -Dspring.profiles.active=test \
            --batch-mode --fail-at-end

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_number }}
          path: fluenthire-api/target/quality-reports/
          retention-days: 90
