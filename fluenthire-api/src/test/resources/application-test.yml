spring:
  application:
    name: fluenthire-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fluenthire_test
    username: fluenthire_user
    password: ${DB_PASSWORD:fluenthire_dev_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 0

jwt:
  secret: test-jwt-secret-that-is-at-least-thirty-two-characters-long-for-hmac
  expiration: 2592000000

claude:
  api-key: ${CLAUDE_API_KEY}
  model: claude-sonnet-4-20250514

openai:
  api-key: dummy-not-used-in-quality-tests

google:
  client-id: dummy-google-client-id

cors:
  allowed-origins: http://localhost:3000

resend:
  api-key: dummy-resend-key
  from-email: test@fluenthire.test

stripe:
  api-key: sk_test_dummy_not_used
  webhook-secret: whsec_test_dummy
  success-url: http://localhost:3000/subscription/success
  cancel-url: http://localhost:3000/pricing
  billing-return-url: http://localhost:3000/profile
  credit-pack-success-url: http://localhost:3000/credits/success

sentry:
  dsn: ""

app:
  base-url: http://localhost:3000
